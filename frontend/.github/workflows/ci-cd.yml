name: Node.js CI/CD Pipeline

# 1. Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- THE CI STAGE (Continuous Integration) ---
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the code from your repository onto the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up the specific Node.js version
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm' # Automatically caches node_modules for faster subsequent runs

    # Step 3: Install dependencies exactly as defined in package-lock.json
    - name: Install Dependencies
      run: npm ci

    # Step 4: Run the Linter to check code style and anti-patterns
    - name: Run Code Linter
      run: npm run lint
      continue-on-error: false # If linting fails, stop the pipeline immediately

    # Step 5: Run Automated Tests
    - name: Run Integration Tests
      run: npm test

  # --- THE CD STAGE (Continuous Deployment placeholder) ---
  deploy:
    needs: build-and-test # Only run deployment if the CI stage passes perfectly
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on actual merges to main
    
    steps:
    - name: Deploy Status Check
      run: echo "CI completed successfully. Ready to trigger a free deployment hook!"